[project]
name = "otrango"
version = "0.1.0"
description = "A voice agent that places real phone calls on your behalf (Python port)."
requires-python = ">=3.11"
dependencies = [
    "flask>=3.0",
    "requests>=2.31",
    "anthropic>=0.40",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["otrango*"]

[tool.setuptools.package-data]
otrango = ["console/*.html", "store/schema/*.sql"]

[tool.pytest.ini_options]
testpaths = ["tests"]
